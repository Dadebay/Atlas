plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def releaseKeyPropertiesFile = rootProject.file('key.properties')
def releaseKeyProperties = new Properties()
if (releaseKeyPropertiesFile.exists()) {
    releaseKeyPropertiesFile.withInputStream { releaseKeyProperties.load(it) }
    ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each { field ->
        if (!releaseKeyProperties.getProperty(field)?.trim()) {
            throw new GradleException("android/key.properties is missing ${field}")
        }
    }
}

android {
    namespace = "tm.com.atlas"
    compileSdk = 36
    ndkVersion = "28.2.13676358"
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "tm.com.atlas"
        minSdk = flutter.minSdkVersion
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled true
    }

    signingConfigs {
        if (releaseKeyPropertiesFile.exists()) {
            release {
                storeFile file(releaseKeyProperties.getProperty('storeFile'))
                storePassword releaseKeyProperties.getProperty('storePassword')
                keyAlias releaseKeyProperties.getProperty('keyAlias')
                keyPassword releaseKeyProperties.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            if (releaseKeyPropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

flutter {
    source = "../.."
}
dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging:21.1.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
